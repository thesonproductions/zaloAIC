  # --- OLLAMA (Local LLM Engine) ---
  ollama:
    image: ollama/ollama:latest
    container_name: chatbot_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ai_network

  # --- BOOTSTRAPPER (Pulls Qwen3) ---
  ollama-puller:
    image: curlimages/curl:latest
    container_name: ollama_init
    depends_on:
      - ollama
    networks:
      - ai_network
    entrypoint: >
      sh -c "
      until curl -s http://ollama:11434/api/tags; do
        echo 'waiting for ollama...';
        sleep 2;
      done;
      if curl -s http://ollama:11434/api/tags | grep -q qwen3:0.6b; then
        echo 'Model already exists';
      else
        echo 'Pulling model (this may take a while)...';
        curl -X POST http://ollama:11434/api/pull -d '{\"name\": \"qwen3:0.6b\"}' --no-buffer;
        echo 'Model pull complete';
      fi;
      echo 'Verifying model...';
      curl -s http://ollama:11434/api/tags;
      "
    restart: "no"

  adk:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: python_agent_app
    depends_on:
      ollama:
        condition: service_started
      ollama-puller:
        condition: service_completed_successfully
    env_file:
      - .env
    expose:
      - "8000"
      - "8001"
    networks:
      - ai_network

  nginx:
    image: nginx:alpine
    container_name: adk_nginx
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - adk
    networks:
      - ai_network

networks:
  ai_network:
    driver: bridge

volumes:
  # postgres_data:
  ollama_data:
  embedding_models: